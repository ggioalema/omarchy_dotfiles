# default apps 
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm-app -- xdg-terminal-exec
# $browser = omarchy-launch-browser
$browser = google-chrome-stable
# $browser = opera

#
# App bindings
#
bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
#bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, S, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
#bindd = SUPER SHIFT, A, Activity, exec, omarchy-launch-tui btop
#bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
#bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"
#bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian":whatsapp
#bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora
#bindd = SUPER SHIFT, P, Passwords, exec, uwsm-app -- 1password
#bindd = SUPER SHIFT, O, Visual Studio Code, exec, code

#
# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
# 
bindd = SUPER SHIFT, T, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, C, Claude, exec, omarchy-launch-webapp "https://claude.ai/"
bindd = SUPER SHIFT, A, Calendar, exec, omarchy-launch-webapp "https://calendar.google.com/calendar/u/0"
bindd = SUPER SHIFT, M, Email (personal), exec, omarchy-launch-webapp "https://mail.google.com/mail/u/0"
bindd = SUPER SHIFT, P, Email (Uni), exec,omarchy-launch-webapp  "https://mail.google.com/mail/u/1"
bindd = SUPER SHIFT, Y, YouTube, exec,omarchy-launch-webapp  "https://youtube.com/"
bindd = SUPER SHIFT, W, WhatsApp, exec, omarchy-launch-webapp "https://web.whatsapp.com/"
bindd = SUPER SHIFT, U, GitHub, exec, omarchy-launch-webapp "https://github.com/"

# Overwrite existing bindings that i don't like
unbind = SUPER, SPACE
bindd = SUPER, D, Launch apps, exec, omarchy-launch-walker
unbind = SUPER, K
#bindd = SUPER, K, Show key bindings, exec, omarchy-menu-keybindings
